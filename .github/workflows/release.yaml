name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/CONTRIBUTING.md"
      - "**/LICENSE-MIT"
      - "**/LICENSE-APACHE-2.0"
      - "**/.vscode/**"
      - "**/docs/**"
      - "**/.gitignore"
      - "**/.gitattributes"
      - "**/.editorconfig"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gen-build-version:
    name: Generate Build Version
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.build_name.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Get the cargo package version
        run: |
          VERSION=$(awk -F '"' '/^version =/ { print $2 }' Cargo.toml)
          echo "The package version is $VERSION"
          echo "NEXT_VERSION=$VERSION" >> $GITHUB_ENV
      - name: Set short git commit SHA
        shell: bash
        run: |
          CALCULATED_SHA=$(git rev-parse --short ${{ github.sha }})
          echo "SHA_SHORT=$CALCULATED_SHA" >> $GITHUB_ENV
      - name: Confirm git commit SHA output
        run: echo $SHA_SHORT
      - name: Confirm nightly build name
        id: build_name
        run: |
          echo $NEXT_VERSION-$SHA_SHORT
          echo build=$NEXT_VERSION-$SHA_SHORT >> $GITHUB_OUTPUT

  build-windows:
    needs: gen-build-version
    name: Build Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "windows"
      - name: Update build number
        run: |
          sed -i 's/Config.gameVersion = \".*\"/Config.gameVersion = \"${{ needs.gen-build-version.outputs.build }}\"/' "${env:GITHUB_WORKSPACE}/script/Config/Version.lua"
      - name: Build
        shell: bash
        run: |
          export PHX_VERSION="${{ needs.gen-build-version.outputs.build }}"
          ./build.sh --run-tests
      - name: Upload development binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-binaries-windows
          path: ${{github.workspace}}/bin/*
      - name: Upload distributable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ltheory-windows
          path: |
            ${{github.workspace}}/bin/*
            !${{github.workspace}}/bin/*.pdb
            ${{github.workspace}}/docs/*
            ${{github.workspace}}/engine/lib/phx/script/*
            ${{github.workspace}}/res/*
            ${{github.workspace}}/script/*
            ${{github.workspace}}/LICENSE-APACHE-2.0
            ${{github.workspace}}/LICENSE-MIT
            ${{github.workspace}}/UNLICENSE-ORIGINAL.txt
            ${{github.workspace}}/NOTICE
            ${{github.workspace}}/README.md

  build-macos:
    needs: gen-build-version
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "macos"
      - name: Build
        run: |
          export PHX_VERSION="${{ needs.gen-build-version.outputs.build }}"
          ./build.sh --run-tests --bundle
      - name: Upload development binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-binaries-macos
          path: |
            ${{github.workspace}}/bin/*
            !${{github.workspace}}/bin/*.app
      - name: Upload distributable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ltheory-macos
          path: ${{github.workspace}}/bin/*.app

  build-linux:
    needs: gen-build-version
    name: Build Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update packages
        run: sudo apt-get update
      - name: Install packages
        run: sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "linux"
      - name: Build
        run: |
          export PHX_VERSION="${{ needs.gen-build-version.outputs.build }}"
          ./build.sh --run-tests
      - name: Upload development binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-binaries-linux
          path: ${{github.workspace}}/bin/*
      - name: Upload distributable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ltheory-linux
          path: |
            ${{github.workspace}}/bin/*
            ${{github.workspace}}/docs/*
            ${{github.workspace}}/engine/lib/phx/script/*
            ${{github.workspace}}/res/*
            ${{github.workspace}}/script/*
            ${{github.workspace}}/LICENSE-APACHE-2.0
            ${{github.workspace}}/LICENSE-MIT
            ${{github.workspace}}/UNLICENSE-ORIGINAL.txt
            ${{github.workspace}}/NOTICE
            ${{github.workspace}}/README.md

  release:
    name: New release
    environment: game-release-signing
    permissions:
      contents: write
    needs:
      - gen-build-version
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - name: Inspect directory after downloading artifacts
        run: ls -alFR
      - name: Zip artifacts
        shell: bash
        run: |
          set -euo pipefail
          for directory in */; do
            archive="${directory%/}.zip"
            (cd "${directory}" && zip -r "../${archive}" .)
          done
      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Sign release archives
        shell: bash
        env:
          GAME_SIGNING_PRIVATE_KEY: ${{ secrets.GAME_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GAME_SIGNING_PRIVATE_KEY}" ]]; then
            echo "GAME_SIGNING_PRIVATE_KEY is not configured in the game-release-signing environment." >&2
            exit 1
          fi
          umask 077
          key_path="${RUNNER_TEMP}/game-release.key"
          trap 'rm -f "${key_path}"' EXIT
          printf '%s' "${GAME_SIGNING_PRIVATE_KEY}" > "${key_path}"
          for archive in ./*.zip; do
            minisign -S -s "${key_path}" -m "${archive}" -x "${archive}.minisig" -t "Limit Theory Redux ${{ needs.gen-build-version.outputs.build }}"
          done
      - name: echo repo
        run: echo ${{github.repository}}
      - name: Get latest release ID
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        id: get_latest_release
        with:
          route: GET /repos/${{github.repository}}/releases/tags/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete latest release
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        with:
          route: DELETE /repos/${{github.repository}}/releases/{release_id}
          release_id: ${{ fromJson(steps.get_latest_release.outputs.data).id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete 'latest' tag ref
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        with:
          route: DELETE /repos/${{github.repository}}/git/refs/tags/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-create 'latest' tag with the current SHA
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        with:
          route: POST /repos/${{github.repository}}/git/refs
          ref: refs/tags/latest
          sha: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Nightly ${{ needs.gen-build-version.outputs.build }}"
          body: "Build log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          tag_name: latest
          draft: false
          prerelease: true
          files: |
            ./*.zip
            ./*.zip.minisig
