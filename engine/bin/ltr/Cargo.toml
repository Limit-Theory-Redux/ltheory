[package]
name = "ltr"

version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
# Forward the phx stats-server feature so `cargo run -p ltr --features stats-server` works.
stats-server = ["phx/stats-server"]
# Forward phx's single-threaded fallback (executes RenderCommands inline on
# the calling thread) for A/B comparison against the threaded pipeline.
immediate = ["phx/immediate"]

[dependencies]
# workspace crates
phx.workspace = true

# external crates
build-time = "0.1"
clap = { version = "4.4", features = ["derive"] }
git-version = "0.3"
libc = "0.2"

[build-dependencies]
winres = "0.1"
