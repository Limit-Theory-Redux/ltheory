<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif" font-size="14">
  <title>Nested gravity wells of a star, a planet and a moon</title>
  <rect width="800" height="520" fill="#ffffff"/>
  <text x="20" y="28" fill="#111827" font-weight="bold">Gravity wells: a ship belongs to the smallest well that contains it</text>
  <!-- star well -->
  <circle cx="220" cy="270" r="200" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="2"/>
  <circle cx="220" cy="270" r="18" fill="#f59e0b"/>
  <text x="220" y="316" fill="#d97706" text-anchor="middle" font-size="13">star</text>
  <!-- planet orbit and well -->
  <circle cx="220" cy="270" r="120" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="340" cy="270" r="75" fill="#dbeafe" fill-opacity="0.6" stroke="#2563eb" stroke-width="2"/>
  <circle cx="340" cy="270" r="10" fill="#2563eb"/>
  <text x="340" y="296" fill="#2563eb" text-anchor="middle" font-size="13">planet</text>
  <!-- moon orbit and well -->
  <circle cx="340" cy="270" r="50" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="390" cy="270" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="390" cy="270" r="4" fill="#16a34a"/>
  <!-- ships -->
  <g fill="#111827">
    <circle cx="520" cy="110" r="6"/>
    <circle cx="110" cy="130" r="6"/>
    <circle cx="290" cy="320" r="6"/>
    <circle cx="395" cy="255" r="5"/>
  </g>
  <g fill="#111827" font-weight="bold">
    <text x="532" y="115">A</text>
    <text x="122" y="135">B</text>
    <text x="276" y="340">C</text>
    <text x="404" y="245">D</text>
  </g>
  <!-- legend -->
  <text x="520" y="190" fill="#111827" font-weight="bold">Ships</text>
  <text x="520" y="214" fill="#111827">A: open space</text>
  <text x="520" y="238" fill="#111827">B: star's well</text>
  <text x="520" y="262" fill="#111827">C: planet's well (also inside the star's)</text>
  <text x="520" y="286" fill="#111827">D: moon's well (also inside both)</text>
  <text x="520" y="334" fill="#6b7280">A planet's well reaches at least 1.5 times</text>
  <text x="520" y="352" fill="#6b7280">the orbit radius of its outermost moon.</text>
  <text x="520" y="384" fill="#6b7280">Dashed circles are orbits.</text>
</svg>
