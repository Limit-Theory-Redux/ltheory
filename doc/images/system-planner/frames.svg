<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif" font-size="14">
  <title>A detour waypoint is an offset from the body it goes around, at the time the ship gets there</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="20" y="28" fill="#111827" font-weight="bold">Waypoint = frame body's position at T + offset</text>
  <!-- the body at time zero, and its orbit to where it is at T -->
  <circle cx="230" cy="250" r="30" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="230" y="206" fill="#6b7280" text-anchor="middle">body at t = 0</text>
  <path d="M262,256 Q400,230 446,318" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 5" marker-end="url(#a)"/>
  <!-- the body where the ship passes it, and its safe sphere -->
  <circle cx="480" cy="340" r="80" fill="#fee2e2" fill-opacity="0.6" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 4"/>
  <circle cx="480" cy="340" r="30" fill="#9ca3af"/>
  <text x="480" y="345" fill="#ffffff" text-anchor="middle">body</text>
  <text x="480" y="448" fill="#dc2626" text-anchor="middle">safe sphere at T</text>
  <!-- the straight leg and the path -->
  <line x1="60" y1="430" x2="740" y2="330" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polyline points="60,430 500,225 740,330" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <circle cx="60" cy="430" r="7" fill="#2563eb"/>
  <text x="60" y="456" fill="#2563eb" text-anchor="middle">start</text>
  <circle cx="740" cy="330" r="7" fill="#2563eb"/>
  <text x="740" y="356" fill="#2563eb" text-anchor="middle">goal</text>
  <!-- the offset from the body's centre at T to the waypoint -->
  <line x1="480" y1="340" x2="498" y2="233" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="500" cy="225" r="6" fill="#111827"/>
  <text x="516" y="208" fill="#111827" font-weight="bold">waypoint (Frame, X, Y, Z, T)</text>
  <text x="516" y="272" fill="#111827">offset</text>
  <text x="516" y="290" fill="#111827">in world axes</text>
</svg>
