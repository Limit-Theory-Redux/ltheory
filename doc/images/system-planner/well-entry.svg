<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif" font-size="14">
  <title>A plan to a goal in a moving body's well: a system leg to the entry waypoint, then a leg in the body's frame</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="20" y="28" fill="#111827" font-weight="bold">Goal in the well of a moving body: system leg, entry waypoint, framed leg</text>
  <!-- the body at time zero and its path to the entry time -->
  <circle cx="330" cy="250" r="150" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="330" y="84" fill="#6b7280" text-anchor="middle">well at t = 0</text>
  <path d="M345,255 Q440,250 520,262" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 5" marker-end="url(#a)"/>
  <!-- the well at the entry time, the entry sphere inside it -->
  <circle cx="560" cy="270" r="150" fill="#dbeafe" fill-opacity="0.5" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 4"/>
  <circle cx="560" cy="270" r="140" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="560" cy="270" r="22" fill="#9ca3af"/>
  <text x="560" y="275" fill="#ffffff" text-anchor="middle">body</text>
  <text x="560" y="450" fill="#2563eb" text-anchor="middle">ZoneRadius (the well) at the entry time</text>
  <text x="560" y="468" fill="#1d4ed8" text-anchor="middle">entry radius = (1 − WELL_ENTRY_MARGIN) · ZoneRadius</text>
  <!-- the system leg to the entry, and the framed leg to the goal -->
  <line x1="60" y1="420" x2="436" y2="340" stroke="#111827" stroke-width="3.5"/>
  <line x1="436" y1="340" x2="600" y2="290" stroke="#2563eb" stroke-width="3.5"/>
  <circle cx="60" cy="420" r="7" fill="#111827"/>
  <text x="60" y="446" fill="#111827" text-anchor="middle">start</text>
  <circle cx="436" cy="340" r="7" fill="#111827"/>
  <line x1="432" y1="347" x2="380" y2="392" stroke="#111827" stroke-width="1"/>
  <text x="200" y="408" fill="#111827" font-weight="bold">entry waypoint (Frame, offset, T)</text>
  <text x="200" y="340" fill="#111827" text-anchor="middle">system part</text>
  <text x="540" y="330" fill="#2563eb" text-anchor="middle" transform="rotate(-17 540 330)">framed part</text>
  <circle cx="600" cy="290" r="7" fill="#2563eb"/>
  <text x="620" y="288" fill="#2563eb">goal</text>
  <!-- the entry offset from the body's centre at the entry time -->
  <line x1="541" y1="281" x2="441" y2="337" stroke="#111827" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)"/>
</svg>
