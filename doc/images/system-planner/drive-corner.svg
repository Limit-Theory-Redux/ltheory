<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif" font-size="14">
  <title>A detour corner under the drive: the path leaves the first leg a lead L before the corner and relaxes onto the second leg</title>
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="20" y="28" fill="#111827" font-weight="bold">A corner that keeps the drive run: no arc, the velocity relaxes onto the new leg</text>

  <!-- legs: n1 along +x to the corner C at (400,300), n2 up and to the right -->
  <line x1="40" y1="300" x2="400" y2="300" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="400" y1="300" x2="720" y2="120" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- the turn path: starts at the lead before the corner, ends on leg 2 -->
  <path d="M 280 300 C 360 300 410 296 460 270 C 520 238 580 204 640 170" fill="none" stroke="#111827" stroke-width="4"/>
  <circle cx="400" cy="300" r="7" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <circle cx="280" cy="300" r="5" fill="#2563eb"/>
  <circle cx="640" cy="170" r="5" fill="#2563eb"/>

  <!-- the lead -->
  <line x1="280" y1="330" x2="400" y2="330" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="350" fill="#2563eb" text-anchor="middle">lead L = speed / k</text>

  <text x="400" y="278" fill="#111827" text-anchor="middle" font-weight="bold">corner</text>
  <text x="280" y="288" fill="#2563eb" text-anchor="middle" font-size="12">turn starts</text>
  <text x="650" y="196" fill="#2563eb" font-size="12">DRIVE_TURN_SETTLE</text>
  <text x="650" y="212" fill="#2563eb" font-size="12">time constants</text>
  <text x="60" y="290" fill="#6b7280">leg 1, direction n1</text>
  <text x="560" y="110" fill="#6b7280">leg 2, direction n2</text>
  <text x="20" y="390" fill="#111827" font-size="12">Through = 1, Radius = 0, Speed = the run's speed. Lowest speed of the turn: speed · cos(turn / 2).</text>
</svg>
