<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif" font-size="14">
  <title>A detour waypoint around a safe sphere</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="20" y="28" fill="#111827" font-weight="bold">Detour around a safe sphere</text>
  <!-- cap circle -->
  <circle cx="400" cy="270" r="160" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text x="400" y="452" fill="#6b7280" text-anchor="middle">MAX_DETOUR_RADII: the farthest a waypoint can be from the centre</text>
  <!-- detour sphere and safe sphere -->
  <circle cx="400" cy="270" r="92" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="3 4"/>
  <circle cx="400" cy="270" r="80" fill="#fee2e2" fill-opacity="0.6" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 4"/>
  <circle cx="400" cy="270" r="30" fill="#9ca3af"/>
  <text x="400" y="275" fill="#ffffff" text-anchor="middle">body</text>
  <!-- straight leg and overlap -->
  <line x1="60" y1="250" x2="740" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="322" y1="250" x2="478" y2="250" stroke="#dc2626" stroke-width="5"/>
  <text x="486" y="268" fill="#dc2626">overlap</text>
  <!-- endpoints -->
  <circle cx="60" cy="250" r="7" fill="#2563eb"/>
  <text x="60" y="276" fill="#2563eb" text-anchor="middle">start</text>
  <circle cx="740" cy="250" r="7" fill="#2563eb"/>
  <text x="740" y="276" fill="#2563eb" text-anchor="middle">goal</text>
  <!-- detour -->
  <polyline points="60,250 400,176 740,250" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <line x1="400" y1="250" x2="400" y2="180" stroke="#111827" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="400" cy="176" r="6" fill="#111827"/>
  <text x="412" y="166" fill="#111827" font-weight="bold">waypoint</text>
  <text x="412" y="128" fill="#111827">half way through the overlap,</text>
  <text x="412" y="146" fill="#111827">on the side away from the centre</text>
  <!-- legend -->
  <line x1="20" y1="52" x2="60" y2="52" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="68" y="57" fill="#dc2626">safe sphere</text>
  <line x1="170" y1="52" x2="210" y2="52" stroke="#d97706" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="218" y="57" fill="#d97706">DETOUR_MARGIN sphere: the tangents from both ends meet at the waypoint</text>
</svg>
