<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif" font-size="14">
  <title>The two kinds of approach: StandOff and Point</title>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>

  <!-- StandOff -->
  <text x="20" y="28" fill="#111827" font-weight="bold">StandOff { radii }  (or { gapM })</text>
  <circle cx="200" cy="190" r="140" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="200" cy="190" r="70" fill="#f59e0b" fill-opacity="0.25" stroke="#d97706" stroke-width="2"/>
  <circle cx="200" cy="190" r="4" fill="#d97706"/>
  <line x1="200" y1="190" x2="270" y2="190" stroke="#d97706" stroke-width="2"/>
  <text x="235" y="182" fill="#d97706" text-anchor="middle">radius</text>
  <line x1="200" y1="190" x2="299" y2="91" stroke="#2563eb" stroke-width="2"/>
  <text x="262" y="124" fill="#2563eb" transform="rotate(-45 262 124)" text-anchor="middle">radii × radius</text>
  <circle cx="299" cy="91" r="9" fill="#2563eb"/>
  <text x="313" y="86" fill="#2563eb">ship stops</text>
  <text x="200" y="352" fill="#6b7280" text-anchor="middle">On the circle around the target's centre,</text>
  <text x="200" y="370" fill="#6b7280" text-anchor="middle">on the side the ship comes from.</text>

  <!-- Point -->
  <text x="440" y="28" fill="#111827" font-weight="bold">Point { offsetRadii = { right, up, forward } }</text>
  <rect x="540" y="130" width="120" height="120" rx="6" fill="#f59e0b" fill-opacity="0.25" stroke="#d97706" stroke-width="2"/>
  <circle cx="600" cy="190" r="4" fill="#d97706"/>
  <text x="600" y="205" fill="#d97706" text-anchor="middle" font-size="12">target</text>
  <line x1="600" y1="190" x2="710" y2="190" stroke="#111827" stroke-width="2" marker-end="url(#k)"/>
  <text x="716" y="195" fill="#111827">right</text>
  <line x1="600" y1="190" x2="600" y2="60" stroke="#111827" stroke-width="2" marker-end="url(#k)"/>
  <text x="608" y="66" fill="#111827">forward</text>
  <line x1="600" y1="190" x2="600" y2="98" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
  <circle cx="600" cy="92" r="9" fill="#2563eb"/>
  <text x="590" y="130" fill="#2563eb" text-anchor="end">offsetRadii.forward</text>
  <text x="590" y="146" fill="#2563eb" text-anchor="end">× radius</text>
  <text x="614" y="88" fill="#2563eb">ship stops</text>
  <text x="600" y="352" fill="#6b7280" text-anchor="middle">At a point fixed to the target's own axes (seen from above,</text>
  <text x="600" y="370" fill="#6b7280" text-anchor="middle">the up axis toward the viewer): it turns with the target.</text>
</svg>
