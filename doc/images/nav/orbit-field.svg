<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="sans-serif" font-size="14">
  <title>Orbit guidance field in the orbit plane</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="540" fill="#ffffff"/>
  <!-- the circle -->
  <circle cx="330" cy="270" r="110" fill="none" stroke="#111827" stroke-width="2.5"/>
  <circle cx="330" cy="270" r="5" fill="#111827"/>
  <text x="340" y="262" fill="#111827">centre</text>
  <!-- field arrows -->
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#a)">
    <line x1="366" y1="257" x2="379" y2="225"/>
    <line x1="317" y1="234" x2="285" y2="221"/>
    <line x1="294" y1="283" x2="281" y2="315"/>
    <line x1="343" y1="306" x2="375" y2="319"/>
    <line x1="363" y1="200" x2="342" y2="173"/>
    <line x1="260" y1="237" x2="233" y2="258"/>
    <line x1="297" y1="340" x2="318" y2="367"/>
    <line x1="400" y1="303" x2="427" y2="282"/>
  </g>
  <g stroke="#111827" stroke-width="2" marker-end="url(#k)">
    <line x1="440" y1="270" x2="440" y2="236"/>
    <line x1="408" y1="192" x2="384" y2="168"/>
    <line x1="330" y1="160" x2="296" y2="160"/>
    <line x1="252" y1="192" x2="228" y2="216"/>
    <line x1="220" y1="270" x2="220" y2="304"/>
    <line x1="252" y1="348" x2="276" y2="372"/>
    <line x1="330" y1="380" x2="364" y2="380"/>
    <line x1="408" y1="348" x2="432" y2="324"/>
  </g>
  <g stroke="#16a34a" stroke-width="2" marker-end="url(#g)">
    <line x1="468" y1="190" x2="435" y2="183"/>
    <line x1="250" y1="132" x2="243" y2="165"/>
    <line x1="192" y1="350" x2="225" y2="357"/>
    <line x1="410" y1="408" x2="417" y2="375"/>
    <line x1="368" y1="53" x2="352" y2="83"/>
    <line x1="113" y1="232" x2="143" y2="248"/>
    <line x1="292" y1="487" x2="308" y2="457"/>
    <line x1="547" y1="308" x2="517" y2="292"/>
  </g>
  <!-- labels -->
  <text x="20" y="30" fill="#111827" font-weight="bold">View along the normal: anticlockwise</text>
  <text x="20" y="50" fill="#6b7280">Arrows are the wanted direction at each point.</text>
  <g fill="#2563eb"><text x="470" y="395" >inside: tangent turned outward</text></g>
  <g fill="#111827"><text x="470" y="415">on the circle: tangent</text></g>
  <g fill="#16a34a"><text x="470" y="435">outside: tangent turned inward</text></g>
  <rect x="452" y="384" width="12" height="12" fill="#2563eb"/>
  <rect x="452" y="404" width="12" height="12" fill="#111827"/>
  <rect x="452" y="424" width="12" height="12" fill="#16a34a"/>
  <text x="470" y="470" fill="#6b7280">The farther off the circle, the more of the</text>
  <text x="470" y="488" fill="#6b7280">arrow points toward it (ORBIT_FIELD_GAIN).</text>
  <!-- side view inset -->
  <rect x="580" y="60" width="200" height="190" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <text x="590" y="82" fill="#111827" font-weight="bold">Side view</text>
  <line x1="590" y1="170" x2="770" y2="170" stroke="#111827" stroke-width="2"/>
  <text x="590" y="190" fill="#6b7280">orbit plane</text>
  <circle cx="680" cy="110" r="8" fill="#2563eb"/>
  <line x1="680" y1="122" x2="680" y2="160" stroke="#111827" stroke-width="2" marker-end="url(#k)"/>
  <line x1="700" y1="110" x2="740" y2="110" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <text x="590" y="215" fill="#6b7280">out of the plane, a climb term</text>
  <text x="590" y="233" fill="#6b7280">pulls the ship back to it</text>
</svg>
