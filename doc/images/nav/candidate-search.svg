<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="sans-serif" font-size="14">
  <title>Candidate search with side memory</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="20" y="28" fill="#111827" font-weight="bold">Side memory: the kept side is expanded around the next obstacle</text>
  <!-- obstacles -->
  <circle cx="280" cy="230" r="50" fill="#9ca3af"/>
  <text x="280" y="236" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="520" cy="125" r="45" fill="#9ca3af"/>
  <text x="520" y="131" fill="#ffffff" text-anchor="middle">2</text>
  <!-- agent and wanted course -->
  <circle cx="70" cy="230" r="11" fill="#2563eb"/>
  <line x1="82" y1="230" x2="720" y2="230" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="730" y="235" fill="#6b7280">wanted</text>
  <!-- kept side candidate: blocked by 2 -->
  <line x1="80" y1="227" x2="520" y2="101" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="494" y="116" fill="#dc2626" font-size="24" font-weight="bold">✕</text>
  <text x="340" y="205" fill="#dc2626">kept side: blocked by obstacle 2</text>
  <!-- other side candidate: clear -->
  <line x1="80" y1="233" x2="560" y2="370" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#g)"/>
  <text x="330" y="352" fill="#16a34a">clear, but on the other side: not taken</text>
  <!-- chosen: expanded around 2 -->
  <line x1="80" y1="226" x2="520" y2="58" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <text x="20" y="60" fill="#2563eb" font-weight="bold">taken: passes 1 and 2 on the kept side</text>
  <text x="20" y="410" fill="#6b7280">A kept-side candidate that a farther obstacle blocks is expanded around that</text>
  <text x="20" y="428" fill="#6b7280">obstacle before a clear candidate on the other side is accepted.</text>
</svg>
