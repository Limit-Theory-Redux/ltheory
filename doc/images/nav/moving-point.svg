<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif" font-size="14">
  <title>Wanted velocity toward a moving point</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- line of sight now and later: parallel -->
  <line x1="120" y1="300" x2="560" y2="150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="302" y1="182" x2="600" y2="80" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- agent and target now -->
  <circle cx="120" cy="300" r="10" fill="#2563eb"/>
  <text x="104" y="328" fill="#2563eb">agent</text>
  <circle cx="560" cy="150" r="8" fill="#111827"/>
  <text x="572" y="170" fill="#111827">moving point</text>
  <!-- target velocity at target -->
  <line x1="560" y1="150" x2="598" y2="84" stroke="#d97706" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="508" y="116" fill="#d97706">its velocity</text>
  <!-- later positions, faded -->
  <circle cx="302" cy="182" r="10" fill="#2563eb" fill-opacity="0.3"/>
  <circle cx="600" cy="80" r="8" fill="#111827" fill-opacity="0.3"/>
  <text x="614" y="88" fill="#6b7280">a moment later:</text>
  <text x="614" y="106" fill="#6b7280">same bearing</text>
  <!-- construction at the agent -->
  <line x1="120" y1="300" x2="160" y2="230" stroke="#d97706" stroke-width="2.5" marker-end="url(#o)"/>
  <line x1="160" y1="230" x2="302" y2="182" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="120" y1="300" x2="302" y2="182" stroke="#111827" stroke-width="4" marker-end="url(#k)"/>
  <text x="20" y="262" fill="#d97706">point's velocity</text>
  <text x="196" y="195" fill="#2563eb" transform="rotate(-19 196 195)">closing speed along the line of sight</text>
  <text x="210" y="274" fill="#111827" font-weight="bold">wanted velocity</text>
  <text x="20" y="30" fill="#111827" font-weight="bold">wanted velocity = point's velocity + closing speed along the line of sight</text>
  <text x="20" y="52" fill="#6b7280">The bearing to the point stays constant, so the agent leads a crossing point without predicting its path.</text>
</svg>
