<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif" font-size="14">
  <title>Closing-speed limit: only the component toward the sphere is limited</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="20" y="28" fill="#111827" font-weight="bold">Only the closing component is limited</text>
  <!-- sphere and hull -->
  <circle cx="560" cy="200" r="86" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 4"/>
  <circle cx="560" cy="200" r="70" fill="#9ca3af"/>
  <text x="560" y="206" fill="#ffffff" text-anchor="middle">sphere</text>
  <text x="470" y="96" fill="#dc2626">hull: surface + agent radius</text>
  <!-- line of sight -->
  <line x1="100" y1="300" x2="476" y2="218" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="100" cy="300" r="10" fill="#2563eb"/>
  <text x="84" y="328" fill="#2563eb">agent</text>
  <!-- chosen course and its parts -->
  <line x1="100" y1="300" x2="310" y2="150" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="322" y="148" fill="#2563eb">chosen course</text>
  <line x1="331" y1="250" x2="310" y2="150" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- limited result -->
  <line x1="100" y1="300" x2="237" y2="270" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <text x="130" y="336" fill="#16a34a">closing component, limited</text>
  <line x1="237" y1="270" x2="215" y2="171" stroke="#111827" stroke-width="2" stroke-dasharray="2 3"/>
  <line x1="100" y1="300" x2="215" y2="171" stroke="#111827" stroke-width="4" marker-end="url(#k)"/>
  <text x="20" y="214" fill="#111827" font-weight="bold">resulting course</text>
  <text x="250" y="300" fill="#111827">dotted: the component along the surface, kept</text>
  <!-- braking margin -->
  <line x1="417" y1="231" x2="476" y2="218" stroke="#d97706" stroke-width="3" marker-start="url(#t)" marker-end="url(#t)"/>
  <text x="360" y="272" fill="#d97706">braking margin</text>
  <text x="330" y="372" fill="#6b7280">limit = stopping_speed(distance to the hull − braking margin)</text>
</svg>
