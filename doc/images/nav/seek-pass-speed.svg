<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif" font-size="14">
  <title>Seek wanted speed against distance to the point</title>
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- axes -->
  <line x1="70" y1="330" x2="660" y2="330" stroke="#111827" stroke-width="1.5"/>
  <line x1="70" y1="330" x2="70" y2="25" stroke="#111827" stroke-width="1.5"/>
  <text x="665" y="335" fill="#111827">distance</text>
  <text x="70" y="18" fill="#111827" text-anchor="middle">wanted speed</text>
  <!-- max_speed -->
  <line x1="70" y1="107" x2="650" y2="107" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="655" y="111" fill="#6b7280">max_speed</text>
  <!-- speed_cap -->
  <line x1="70" y1="170" x2="650" y2="170" stroke="#d97706" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="655" y="174" fill="#d97706">speed_cap</text>
  <!-- pass_speed -->
  <line x1="70" y1="260" x2="160" y2="260" stroke="#2563eb" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="76" y="250" fill="#2563eb">pass_speed</text>
  <!-- Arrive's curve, moved: it would end at rest -->
  <path d="M160,260 L140,271 L120,284 L100,303 L90,330" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="300" y="300" fill="#6b7280">the curve Arrive would follow,</text>
  <text x="300" y="318" fill="#6b7280">moved: it would end at rest</text>
  <!-- wanted speed -->
  <path d="M650,170 L456,170 L440,173.5 L400,182.7 L360,192.5 L320,203 L280,214.7 L240,227.5 L200,242 L160,260 L70,260" fill="none" stroke="#111827" stroke-width="4"/>
  <text x="520" y="150" fill="#111827" font-weight="bold">wanted speed</text>
  <text x="90" y="186" fill="#2563eb">Arrive's braking curve,</text>
  <text x="90" y="204" fill="#2563eb">moved to end at pass_speed</text>
  <!-- markers -->
  <line x1="160" y1="260" x2="160" y2="330" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="70" y1="260" x2="70" y2="330" stroke="#111827" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="70" y="352" fill="#111827" text-anchor="middle">0 (the point)</text>
  <text x="160" y="352" fill="#2563eb" text-anchor="middle">arrival radius</text>
  <text x="456" y="352" fill="#d97706" text-anchor="middle">far away: the cap</text>
  <line x1="456" y1="170" x2="456" y2="330" stroke="#d97706" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
