<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif" font-size="14">
  <title>Avoidance share: a resting obstacle against a steering agent</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- row 1: share 1 -->
  <text x="20" y="28" fill="#111827" font-weight="bold">Obstacle that does not steer (share 1): the agent takes the whole detour</text>
  <line x1="90" y1="100" x2="710" y2="100" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="400" cy="100" r="30" fill="#9ca3af"/>
  <circle cx="90" cy="100" r="11" fill="#2563eb"/>
  <polyline points="101,98 330,52 470,52 700,98" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <line x1="440" y1="100" x2="440" y2="55" stroke="#111827" stroke-width="1.5" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="450" y="82" fill="#111827">d</text>
  <!-- row 2: share 1/2 -->
  <text x="20" y="208" fill="#111827" font-weight="bold">Another steering agent (share ½): each takes half, so the pair passes</text>
  <line x1="90" y1="300" x2="710" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="90" cy="300" r="11" fill="#2563eb"/>
  <circle cx="710" cy="300" r="11" fill="#16a34a"/>
  <polyline points="101,298 330,274 470,274 700,298" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <polyline points="699,302 470,326 330,326 100,302" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <line x1="400" y1="300" x2="400" y2="276" stroke="#111827" stroke-width="1.5" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="410" y="294" fill="#111827">d / 2</text>
  <line x1="440" y1="300" x2="440" y2="324" stroke="#111827" stroke-width="1.5" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="450" y="318" fill="#111827">d / 2</text>
  <text x="20" y="378" fill="#6b7280">Each agent tests its courses against the other as a sphere moving at the mean of the two velocities.</text>
</svg>
